<!doctype html>
<html lang="zh"><meta charset="utf-8"><title>TieZ 材质测试背景</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: #b7c6d7; color: #172333; font: 15px system-ui; }
  #scene { position: absolute; inset: 0; background: linear-gradient(125deg,#d4dbe0 0 25%,#6aafa7 25% 48%,#94bde1 48% 70%,#c1cbd6 70%); }
  #scene::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg,transparent 0 78px,#ffffffb0 78px 80px); }
  #scene::after { content: ""; position: absolute; left: 320px; top: 120px; width: 12px; height: 85%; background: #f5f5f5; animation: travel 8s ease-in-out infinite alternate; }
  #scene[data-mode="black"] { background: #000; } #scene[data-mode="white"] { background: #fff; }
  #scene[data-mode="gray"] { background: #8b8b8b; }
  #scene:not([data-mode="pattern"])::before, #scene:not([data-mode="pattern"])::after { display: none; }
  #scene p { margin: 490px 180px; font: 600 42px/2.4 system-ui; }
  #scene[data-mode^="motion-"] { background: #ececec; }
  #scene[data-mode^="motion-"] > p { display: none; }
  #qa-motion-layer { position: absolute; inset: 0; overflow: hidden; display: none; }
  #scene[data-mode^="motion-"] #qa-motion-layer { display: block; }
  .qa-motion-text { position: absolute; color: #101010; white-space: nowrap; -webkit-font-smoothing: antialiased; }
  .qa-motion-text-row { height: 108px; }
  .qa-motion-text-small { font: 500 16px/24px system-ui; }
  .qa-motion-text-large { font: 600 44px/60px system-ui; }
  .qa-motion-edge { position: absolute; top: 0; bottom: 0; background: #101010; }
  .qa-motion-diagonal { position: absolute; inset: -256px; background: repeating-linear-gradient(135deg, #101010 0 18px, #ececec 18px 36px); }
  nav { position: relative; z-index: 1; padding: 18px 24px; background: #f1f4f8; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  button, select { font: inherit; padding: 8px 12px; border: 1px solid #8795a7; border-radius: 8px; background: white; color: #172333; }
  output { padding: 6px; font: 14px monospace; }
  @keyframes travel { to { transform: translateX(800px); } }
  @media (prefers-reduced-motion: reduce) { #scene::after { animation: none; } }
</style>
<div id="scene" data-mode="pattern"><p>材质测试 · 虚构内容<br>0123456789<br>ABCDEFGHIJKLMNOPQRSTUVWXYZ</p><div id="qa-motion-layer" aria-hidden="true"></div></div>
<nav aria-label="材质测试控制">
  <strong>TieZ 材质验收</strong>
  <label>背景 <select id="background"><option value="pattern">动态线条</option><option value="black">纯黑</option><option value="white">纯白</option><option value="gray">中灰</option></select></label>
  <button id="visibility">隐藏 / 显示窗口</button><button id="size">切换窄宽</button><button id="position">移动窗口</button><button id="exit">结束测试</button>
  <button id="clear-region" disabled>模拟圆角区域丢失</button>
  <button id="minimize-restore">最小化后恢复</button>
  <output id="status">等待材质状态</output>
  <small>窗口内底部测试按钮可保持主窗口前台</small>
</nav>
<script type="module">
  import { invoke } from "/node_modules/@tauri-apps/api/core.js";
  const status = document.querySelector("#status");
  const run = (name, args) => invoke(name, args).catch(error => { status.textContent = String(error); });
  const paintOpportunity = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  let motionRunning = null;
  window.addEventListener("tiez:qa-optics-motion", async event => {
    const { scene: name, generation, clientBounds: bounds } = event.detail ?? {};
    if (!["text_y", "edge_x", "diagonal_xy"].includes(name)
      || !Number.isSafeInteger(generation) || generation < 1 || generation > 3 || motionRunning) return;
    const motionToken = {};
    motionRunning = motionToken;
    let animation;
    const eventReceivedTimeMs = Date.now();
    const eventReceivedPerformanceMs = performance.now();
    try {
      if (!bounds || ![bounds.x, bounds.y, bounds.width, bounds.height].every(Number.isFinite)
        || bounds.width <= 0 || bounds.height <= 0 || bounds.width > innerWidth || bounds.height > innerHeight
        || bounds.x + bounds.width <= 0 || bounds.y + bounds.height <= 0 || bounds.x >= innerWidth || bounds.y >= innerHeight) {
        throw new Error("Invalid relative client bounds for the two fixture windows");
      }
      const scene = document.querySelector("#scene");
      const layer = document.querySelector("#qa-motion-layer");
      layer.replaceChildren();
      scene.dataset.mode = `motion-${name}`;
      // All source colors are neutral. Any spectral separation must be
      // evaluated against this unrefracted source, not a painted rainbow.
      const source = document.createElement("div");
      let from, to, sourceDescription;
      if (name === "text_y") {
        source.className = "qa-motion-text";
        source.style.left = `${bounds.x - 80}px`;
        source.style.top = `${bounds.y - 320}px`;
        source.style.width = `${bounds.width + 160}px`;
        for (let index = 0; index < 18; index += 1) {
          const row = document.createElement("div");
          row.className = "qa-motion-text-row";
          const small = document.createElement("div");
          small.className = "qa-motion-text-small";
          small.textContent = "虚构材质样本 0123456789 ABCDEFGH · 文字沿 Y 移动 · ".repeat(3);
          const large = document.createElement("div");
          large.className = "qa-motion-text-large";
          large.textContent = "AaBb 0123456789 虚构文字 ".repeat(3);
          row.append(small, large);
          source.append(row);
        }
        from = "translateY(0px)";
        to = "translateY(-360px)";
        sourceDescription = "16px and 44px neutral fictional text; Y translation -360 CSS px";
      } else if (name === "edge_x") {
        source.className = "qa-motion-edge";
        source.style.left = `${-innerWidth}px`;
        source.style.width = `${innerWidth}px`;
        from = `translateX(${bounds.x - 32}px)`;
        to = `translateX(${bounds.x + bounds.width + 32}px)`;
        sourceDescription = "neutral dark/light vertical step crossing both side corners along X";
      } else {
        source.className = "qa-motion-diagonal";
        from = "translate(0px, 0px)";
        to = "translate(150px, 130px)";
        sourceDescription = "18 CSS px alternating neutral diagonal stripes; XY translation 150/130 CSS px";
      }
      source.style.transform = from;
      layer.append(source);
      await paintOpportunity();
      const preparedTimeMs = Date.now();
      const animationStartTimeMs = Date.now();
      const animationStartPerformanceMs = performance.now();
      animation = source.animate([{ transform: from }, { transform: to }], {
        duration: 4500, easing: "linear", fill: "forwards", iterations: 1
      });
      await paintOpportunity();
      const common = {
        generation, scene: name, inputMethod: "fixed Web Animations source translation in own fixture backdrop",
        sourceDescription, sourceColors: ["#101010", "#ececec"], clientBounds: bounds,
        viewportCss: { width: innerWidth, height: innerHeight, devicePixelRatio },
        eventReceivedTimeMs, eventReceivedPerformanceMs, preparedTimeMs,
        animationStartTimeMs, animationStartPerformanceMs, requestedDurationMs: 4500
      };
      await invoke("qa_optics_motion_ack", {
        ...common, phase: "started", ok: true, ackTimeMs: Date.now(),
        ackPerformanceMs: performance.now(), animationTimeMs: animation.currentTime
      });
      await animation.finished;
      const animationFinishedTimeMs = Date.now();
      const animationFinishedPerformanceMs = performance.now();
      await paintOpportunity();
      // Release the local gate before the completion IPC permits Rust to
      // request the next scene; an in-flight promise must not drop that event.
      motionRunning = null;
      await invoke("qa_optics_motion_ack", {
        ...common, phase: "finished", ok: true, animationFinishedTimeMs, animationFinishedPerformanceMs,
        ackTimeMs: Date.now(), ackPerformanceMs: performance.now(), animationTimeMs: animation.currentTime,
        actualElapsedMs: animationFinishedPerformanceMs - animationStartPerformanceMs,
        finalTransform: getComputedStyle(source).transform
      });
    } catch (error) {
      animation?.cancel();
      if (motionRunning === motionToken) motionRunning = null;
      await run("qa_optics_motion_ack", { generation, scene: name, phase: "finished", ok: false,
        eventReceivedTimeMs, ackTimeMs: Date.now(), error: error instanceof Error ? error.message : String(error) });
    } finally {
      if (motionRunning === motionToken) motionRunning = null;
    }
  });
  window.addEventListener("tiez:qa-background", async event => {
    const { mode, generation } = event.detail ?? {};
    if (!["gray", "pattern"].includes(mode) || !Number.isSafeInteger(generation) || generation < 0) return;
    document.querySelector("#scene").dataset.mode = mode;
    document.querySelector("#background").value = mode;
    // Acknowledge the applied DOM on a subsequent paint opportunity; native
    // capture readiness is checked independently by the fixture driver.
    await paintOpportunity();
    await run("qa_background_ready", { mode, generation });
  });
  let narrow = false, right = false;
  document.querySelector("#background").onchange = event => {
    document.querySelector("#scene").dataset.mode = event.target.value;
    run("qa_refocus_window");
  };
  document.querySelector("#visibility").onclick = () => run("qa_toggle_window");
  document.querySelector("#size").onclick = () => run("qa_resize_window", { narrow: narrow = !narrow });
  document.querySelector("#position").onclick = () => run("qa_move_window", { right: right = !right });
  document.querySelector("#clear-region").onclick = () => run("qa_clear_window_region");
  document.querySelector("#minimize-restore").onclick = async event => {
    const button = event.currentTarget;
    button.disabled = true;
    await run("qa_minimize_window");
    setTimeout(() => { run("qa_restore_window").finally(() => { button.disabled = false; }); }, 800);
  };
  document.querySelector("#exit").onclick = () => run("qa_exit");
  setInterval(async () => {
    try { const value = await invoke("get_native_glass_status"); const text = `${value.state} · revision ${value.revision}`; if (status.textContent !== text) status.textContent = text; document.querySelector("#clear-region").disabled = value.state !== "ready"; }
    catch (error) { status.textContent = String(error); }
  }, 500);
</script>
</html>
