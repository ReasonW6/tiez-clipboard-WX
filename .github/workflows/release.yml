name: Publish Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bin tiez-app
      - name: Verify signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Configure TAURI_SIGNING_PRIVATE_KEY using the key matching src-tauri/tauri.conf.json. See docs/RELEASING.md.'
          }
      - uses: tauri-apps/tauri-action@v0
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: TieZ v__VERSION__
          releaseBody: Windows local clipboard edition.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json --bundles nsis
      - name: Package portable archive
        shell: pwsh
        run: ./scripts/build-portable.ps1 -SkipBuild
      - name: Upload portable archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $assetName = 'TieZ_{0}_x64_portable.zip' -f $version
          gh release upload "v$version" "artifacts/portable/tiez-portable.zip#$assetName" --repo $env:GITHUB_REPOSITORY --clobber
